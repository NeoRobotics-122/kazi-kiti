
<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neo Robotics - Akıllı Kazı Analiz</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background-color: #f4f4f9; padding: 20px; }
        .container { max-width: 600px; margin: 0 auto; background: white; padding: 20px; border-radius: 10px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
        h2 { color: #2c3e50; text-align: center; }
        
        /* Görsel Alanı */
        .scan-preview { text-align: center; margin-bottom: 20px; border: 2px dashed #bdc3c7; padding: 10px; border-radius: 8px; background-color: #ecf0f1; min-height: 200px; display: flex; flex-direction: column; justify-content: center; align-items: center;}
        .scan-preview img { max-width: 100%; height: auto; border-radius: 5px; display: none; } /* Başlangıçta gizli */
        
        /* Dosya Yükleme Butonu */
        input[type="file"] { display: none; }
        .custom-file-upload {
            border: 1px solid #ccc;
            display: inline-block;
            padding: 10px 20px;
            cursor: pointer;
            background-color: #3498db;
            color: white;
            border-radius: 5px;
            margin-top: 10px;
            font-weight: bold;
        }
        .custom-file-upload:hover { background-color: #2980b9; }

        /* Form Alanı */
        .form-group { margin-bottom: 15px; }
        label { display: block; font-weight: bold; margin-bottom: 5px; color: #34495e; }
        input, select { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 5px; box-sizing: border-box; }
        
        button { width: 100%; padding: 15px; background-color: #e67e22; color: white; border: none; border-radius: 5px; font-size: 16px; cursor: pointer; transition: 0.3s; }
        button:hover { background-color: #d35400; }

        /* Sonuç Belgesi */
        #report-card { display: none; border: 2px solid #2c3e50; padding: 20px; margin-top: 20px; background: #fffaf0; position: relative; }
        .report-header { border-bottom: 2px solid #e67e22; padding-bottom: 10px; margin-bottom: 10px; }
        .report-item { margin-bottom: 8px; font-size: 1.1em; }
        
        /* Rapor görseli */
        #report-img { max-width: 150px; float: right; border: 1px solid #ddd; margin: 10px; }
    </style>
</head>
<body>

<div class="container" id="main-form">
    <h2>🏺 Akıllı Kazı Analiz Sistemi</h2>
    
    <div class="scan-preview">
        <label for="file-upload" class="custom-file-upload">
            📸 Taranacak Nesneyi Yükle
        </label>
        <input id="file-upload" type="file" accept="image/*" onchange="previewImage(event)"/>
        
        <p id="placeholder-text" style="color:#7f8c8d; margin-top:10px;">Görsel bekleniyor...</p>
        <img id="preview-img" alt="Taranan Obje">
    </div>

    <div class="form-group">
        <label>Buluntu Adı / Türü:</label>
        <input type="text" id="objName" placeholder="Örn: Seramik Çömlek Parçası">
    </div>

    <div class="form-group">
        <label>Nesne Boyutu (cm):</label>
        <input type="text" id="objSize" placeholder="Örn: 12x8 cm">
    </div>

    <div class="form-group">
        <label>Bulunduğu Tarih:</label>
        <input type="date" id="findDate">
    </div>

    <div class="form-group">
        <label>Dönem / Uygarlık:</label>
        <input type="text" id="civilization" placeholder="Örn: Hitit Dönemi">
    </div>

    <div class="form-group">
        <label>Toprak Tipi:</label>
        <select id="soilType">
            <option value="Killi">Killi Toprak</option>
            <option value="Kireçli">Kireçli Toprak</option>
            <option value="Humuslu">Humuslu Toprak</option>
            <option value="Kumlu">Kumlu Toprak</option>
        </select>
    </div>

    <button onclick="generateReport()">📄 Envanter Belgesini Oluştur</button>
</div>

<div class="container" id="report-card">
    <div class="report-header">
        <h2 style="margin:0;">RESMİ KAZI ENVANTER FİŞİ</h2>
        <small>Neo Robotics Arkeoloji Birimi - FLL Sezonu</small>
    </div>
    
    <img id="report-img" alt="Buluntu Görseli">

    <div class="report-item"><strong>📦 Buluntu:</strong> <span id="outName"></span></div>
    <div class="report-item"><strong>📏 Boyut:</strong> <span id="outSize"></span></div>
    <div class="report-item"><strong>📅 Tarih:</strong> <span id="outDate"></span></div>
    <div class="report-item"><strong>🏛️ Uygarlık:</strong> <span id="outCiv"></span></div>
    <div class="report-item"><strong>🌍 Toprak Analizi:</strong> <span id="outSoil"></span></div>
    
    <br style="clear:both;"> <button onclick="window.print()" style="margin-top:20px; background-color:#27ae60;">🖨️ Yazdır / PDF Kaydet</button>
    <button onclick="location.reload()" style="margin-top:10px; background-color:#95a5a6;">Yeni Tarama Yap</button>
</div>

<script>
    // Bugünün tarihini otomatik doldur
    document.getElementById('findDate').valueAsDate = new Date();

    // Resmi Yükleyip Gösteren Fonksiyon
    function previewImage(event) {
        var reader = new FileReader();
        reader.onload = function(){
            var output = document.getElementById('preview-img');
            output.src = reader.result;
            output.style.display = "block"; // Resmi görünür yap
            
            // Placeholder yazısını ve butonu gizle (isteğe bağlı, şimdilik sadece yazıyı gizliyorum)
            document.getElementById('placeholder-text').style.display = 'none';
        }
        reader.readAsDataURL(event.target.files[0]);
    }

    function generateReport() {
        // Değerleri al
        const name = document.getElementById('objName').value;
        const size = document.getElementById('objSize').value;
        const date = document.getElementById('findDate').value;
        const civ = document.getElementById('civilization').value;
        const soil = document.getElementById('soilType').value;
        const imgSrc = document.getElementById('preview-img').src; // Yüklenen görseli al

        if(name === "" || civ === "") {
            alert("Lütfen önemli alanları doldurunuz!");
            return;
        }

        // Değerleri rapora yaz
        document.getElementById('outName').innerText = name;
        document.getElementById('outSize').innerText = size;
        document.getElementById('outDate').innerText = date;
        document.getElementById('outCiv').innerText = civ;
        document.getElementById('outSoil').innerText = soil;
        
        // Görseli rapora aktar
        document.getElementById('report-img').src = imgSrc;

        // Formu gizle, raporu göster
        document.getElementById('main-form').style.display = 'none';
        document.getElementById('report-card').style.display = 'block';
    }
</script>

</body>
</html>
